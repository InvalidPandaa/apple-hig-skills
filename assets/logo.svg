      <g fill="#fff">
        <rect x="266" y="414" width="214" height="60" rx="30" opacity=".96"/>
        <circle cx="592" cy="444" r="30" opacity=".96"/>
        <rect x="266" y="532" width="356" height="30" rx="15" opacity=".72"/>
        <rect x="266" y="588" width="250" height="30" rx="15" opacity=".5"/>
